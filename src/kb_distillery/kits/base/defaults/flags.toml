# Feature-flag registry — the single source for backend and frontend (see meta/docs/dev.md § Feature flags).
# One [[flag]] table per flag. `pixi run flags-gen` regenerates web/src/flags/registry.gen.ts and the
# share route lists (web/src/routes/modules.share-*.ts); `pixi run flags-check` fails when they are stale.
#
#   kind = "build"   decided when the bundle is built (a screen that is not in a build is not in its JS at all)
#   kind = "runtime" read at run time; server-side overrides arrive with the flags API (G2)
#   envs             value per environment: local (the app on this Mac), private / public (the share builds)
#   default          the value for an environment the registry does not know (fail-safe side: off)
#   screen.<id>      a build flag that includes src/features/<id>/ in the share builds where it is on

[[flag]]
name = "screen.lifecycle"
description = "Lifecycle screen (versions, history, snapshots). Read-only on the private site; never in public snapshots."
owner = "maintainer"
created = 2026-10-25
expires = 2027-10-25
kind = "build"
default = false
envs = { local = true, private = true, public = false }

[[flag]]
name = "screen.share"
description = "Share admin panel (public snapshots). Needs the Worker's /admin/api, so only the private site has it."
owner = "maintainer"
