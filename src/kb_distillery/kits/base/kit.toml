[kit]
name = "base"
version = 1
description = "A small general knowledge base: documents, notes and articles digested into ideas, questions, topics and people."

# Chat agent: the app skills it may use (each must be `audience: app` and `mode: read`). A kb.toml `[agent] skills`
# replaces this list; an empty list turns skills off.
[agent]
skills = ["deep-research"]

# The smallest ontology that stands on its own. Every layer is given here on purpose: a layer with no table falls
# back to the explorer's research-style defaults (kb_distillery.vault.kbtypes), which a small kit must not inherit.
# `color` is left out where a kb extending this kit is likely to add types of its own: the loader then picks
# a palette colour no other type uses, so two types never share one.
[types]

# --- Sources: the digest of one raw item --------------------------------------------------------------------
[types.source.article]
label = "Article"
prefix = "article-"

[types.source.notes]
label = "Notes"
prefix = "notes-"
color = "#ffc777"

[types.source.document]
label = "Document"
prefix = "doc-"
color = "#eab0ee"

[types.source.capture]          # my own thought (reMarkable page, photo of paper, screenshot): thought-ingest
label = "Capture"
prefix = "capture-"
color = "#b4f9f8"

# --- Collections: how sources group ---------------------------------------------------------------------------
[types.collection.series]
label = "Series"
prefix = "series-"
kind = "contents"             # member files listed in a Contents table

# --- Concepts: what the kb grows -------------------------------------------------------------------------------
[types.concept.topic]
label = "Topic"
prefix = "theme-"

[types.concept.idea]
label = "Idea"
prefix = ""

[types.concept.question]
label = "Question"
prefix = "q-"
status = ["open", "partial", "resolved"]

[types.concept.person]
label = "Person"
prefix = ""
status = []                   # no status: progress is `verified:` (src/kb_distillery/vault/persons.py)
color = "#bb9af7"

# --- Edges: the typed relations a page may state in its `relations:` block -------------------------------------
[edges]
types = ["extends", "uses"]
