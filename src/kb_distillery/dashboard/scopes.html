<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thesis Wiki — Scopes</title>
  <script src="/static/shell.js"></script>
  <link rel="stylesheet" href="/static/shell.css">
  <link rel="stylesheet" href="/static/scopes.css?v=2">
  <script src="/static/scopes.js?v=2-blank" defer></script>
</head>
<body class="has-app-nav scopes-page">
  {{NAV}}
  <main class="sc-main">
    <aside class="sc-list-col" aria-label="Scopes">
      <header class="sc-list-head">
        <h1>Scopes</h1>
        <button type="button" class="sc-btn primary sc-write" id="sc-new">New scope</button>
      </header>
      <p class="sc-note" id="sc-list-note">Loading…</p>
      <ul class="sc-list" id="sc-list"></ul>
    </aside>
    <section class="sc-editor-col" id="sc-editor" aria-label="Scope editor">
      <p class="sc-note sc-empty" id="sc-empty">Pick a scope on the left, or start a new one. A scope is a saved set of raw files; build one from the Graph by selecting nodes and adding them to a scope.</p>
    </section>
  </main>
</body>
</html>
