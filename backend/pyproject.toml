[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kb"
version = "0.1.0"
description = "Thesis knowledge base: vault tooling, services and API (package kb)"
requires-python = ">=3.11"
dependencies = []          # pixi owns the environment; see ../pixi.toml

[project.scripts]
kbd = "kb.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-p no:cacheprovider"
