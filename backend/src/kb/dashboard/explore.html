<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thesis Wiki — Explore</title>
  <script>
    // ?embed=1: the graph's side reader — page only, no nav bar or sidebars
    if (new URLSearchParams(location.search).has("embed")) {
      document.documentElement.classList.add("ex-embed");
      document.addEventListener("click", (e) => {   // links out of Explore (graph, other tabs) leave the reader
        const a = e.target.closest && e.target.closest("a[href]");
        if (a && a.origin === location.origin && a.pathname !== "/explore" && window.top !== window) { e.preventDefault(); window.top.location.href = a.href; }
      });
    }
  </script>
  <script src="/static/shell.js"></script>
  <link rel="stylesheet" href="/static/shell.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="/static/explore.css?v=7">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" defer></script>
  <script src="/static/explore.js?v=6" defer></script>
</head>
<body class="has-app-nav explore-page">
  {{NAV}}

  <div class="ex-layout">
    <aside class="ex-side" id="ex-side">
      <div class="ex-search">
        <input type="search" id="ex-search" placeholder="Search pages…   ( / )" autocomplete="off" spellcheck="false" aria-label="Search pages">
        <div class="ex-suggest hidden" id="ex-suggest" role="listbox"></div>
      </div>

      <nav class="ex-side-actions">
        <a href="#/" class="ex-side-link">Home</a>
        <button type="button" class="ex-side-link" id="btn-random" title="Random page (r)">Surprise me</button>
        <a href="#/path" class="ex-side-link">Connect two pages</a>
      </nav>

      <section class="ex-side-section hidden" id="sec-toc">
        <h3>On this page</h3>
        <ol class="ex-toc" id="ex-toc"></ol>
      </section>

      <section class="ex-side-section hidden" id="sec-pins">
        <h3>Pinned</h3>
        <ul class="ex-list" id="ex-pins"></ul>
      </section>

      <section class="ex-side-section hidden" id="sec-trail">
        <h3>Trail <button type="button" class="ex-mini" id="btn-clear-trail" title="Clear trail">clear</button></h3>
        <ul class="ex-list" id="ex-trail"></ul>
      </section>

      <p class="ex-keys"><kbd>/</kbd> search · <kbd>r</kbd> random · <kbd>p</kbd> pin · <kbd>g</kbd> graph · <kbd>h</kbd> home</p>
    </aside>

    <main class="ex-main" id="ex-main" tabindex="-1">
      <p class="subtle">Loading…</p>
    </main>

    <aside class="ex-rail" id="ex-rail"></aside>
  </div>

  <div class="ex-hover hidden" id="ex-hover"></div>
</body>
</html>
