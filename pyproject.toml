[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kb-distillery"
version = "0.1.0"
description = "Build and keep a knowledge base: ingest, distill, lint, and read it as a graph (engine for any kb folder)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "The kb-distillery authors"}]
requires-python = ">=3.11"
# Runtime dependencies (what `distill init`, doctor, lint, the app and the API import without an optional feature).
# pixi.toml owns the dev environment (node, pytest, notebooks); nothing here is dev-only.
dependencies = [
    "fastapi>=0.162,<0.163",
    "uvicorn>=0.54,<0.55",
    "python-multipart>=0.0.9",           # the bundle upload of POST /api/kb/import
    "pydantic>=2",
    "httpx>=0.28.1,<0.29",
    "truststore>=0.9",
    "pyyaml>=6",
    "numpy>=2",
    "grand-cypher>=1.2",
    "networkx>=3.4",
    "claude-agent-sdk>=0.1.0",
    "pyjwt[crypto]>=2",
]

[project.urls]
Homepage = "https://github.com/yGit741/kb-distillery"
Repository = "https://github.com/yGit741/kb-distillery"
Issues = "https://github.com/yGit741/kb-distillery/issues"
Changelog = "https://github.com/yGit741/kb-distillery/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# The Google Drive connector reads the macOS Drive for desktop mount: no Python dependency, the extra names the feature.
gdrive = []
# PDF text, images, video frames and OCR. pypdfium2 (BSD / Apache) reads and renders PDFs; PyMuPDF was dropped for its AGPL licence.
ingest-heavy = [
    "pypdfium2>=4",
    "pillow",
    "opencv-python-headless>=4.10",
    "imageio-ffmpeg>=0.5",
    "yt-dlp[default,curl-cffi]>=2025.1",
    "ocrmac>=1.0; sys_platform == 'darwin'",
]
dev = ["pytest>=8", "pytest-xdist>=3", "ruff", "build", "import-linter>=2"]

[project.scripts]
distill = "kb_distillery.cli:main"
kbd = "kb_distillery.cli:kbd_main"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_distillery"]
# The built web app is gitignored (vite writes it here); hatch drops ignored files unless they are artifacts.
artifacts = ["src/kb_distillery/_webapp/**"]

# The kits (src/kb_distillery/kits: kit.toml, defaults/, skills, later hooks) are package data: `packages` above
# carries every tracked file under the package, so they need no entry here.
# The Cloudflare Worker (publish/cloudflare/worker) is package data too. Nothing is force-included any more.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-p no:cacheprovider"
markers = [
    "serial: asserts a wall-clock budget, so it runs alone in a single process (the tests gate's second pass); never in the -n pass",
    "wheel: builds the wheel and installs it into a temp venv (slow, needs network for the build backend); CI job `wheel`",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]      # syntax errors, undefined names: the cheap class of real bugs

[tool.importlinter]
# Layer contract (Lane E): a package imports only from its own layer or one below.
# `A : B` = siblings that may import each other. Not in the contract: `kits` (data, no Python),
# `_webapp` (built assets).
root_package = "kb_distillery"

[[tool.importlinter.contracts]]
name = "kb_distillery layers"
type = "layers"
containers = ["kb_distillery"]
layers = [
    # entry points: the CLI, the HTTP server and the other `python -m` shells
    "cli : server : doctor : init_kb : perf : __main__",
    # use cases that compose the pipeline stages below, and the things that ship the result
    "services : publish : webbuild : proposals",
    # pipeline stages, each one concern
    "ingest : digest : distill : graph : search : lint : metrics : ops : git : migrations : parse",
    # the vault model, the LLM gateway, storage connectors and the publisher port (they know nothing of the stages above)
    "vault : llm : storage : hosting",
    # configuration and locations: depend on nothing in the engine
    "config",
]
# Every current violation, grouped by cycle. A cycle-fix PR deletes its group; nothing else belongs here.
ignore_imports = [
    # cycle: graph/propose.py <-> services: stays until the typed-edges work lands (graph/propose.py is that work's file;
    # no backlog card is filed for it yet, see the Lane E plan). services/cypher.py exists only for this leg.
    "kb_distillery.graph.propose -> kb_distillery.services.cypher",
]
