[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kb-distillery"
version = "0.1.0"
description = "Build and keep a knowledge base: ingest, distill, lint, and read it as a graph (engine for any kb folder)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# Runtime dependencies (what `distill init`, doctor, lint, the app and the API import without an optional feature).
# pixi.toml owns the dev environment (node, pytest, notebooks); nothing here is dev-only.
dependencies = [
    "fastapi>=0.162,<0.163",
    "uvicorn>=0.54,<0.55",
    "pydantic>=2",
    "httpx>=0.28.1,<0.29",
    "truststore>=0.9",
    "pyyaml>=6",
    "numpy>=2",
    "grand-cypher>=1.2",
    "networkx>=3.4",
    "claude-agent-sdk>=0.1.0",
    "pyjwt[crypto]>=2",
]

[project.optional-dependencies]
# The Google Drive connector reads the macOS Drive for desktop mount: no Python dependency, the extra names the feature.
gdrive = []
# PDF text, images, video frames and OCR. pymupdf is AGPL: decision 7 swaps it for pypdfium2 in Lane H, not here.
ingest-heavy = [
    "pymupdf",
    "pillow",
    "opencv-python-headless>=4.10",
    "imageio-ffmpeg>=0.5",
    "yt-dlp[default,curl-cffi]>=2025.1",
    "ocrmac>=1.0; sys_platform == 'darwin'",
]
dev = ["pytest>=8", "pytest-xdist>=3", "ruff", "build", "import-linter"]

[project.scripts]
distill = "kb_distillery.cli:main"
kbd = "kb_distillery.cli:kbd_main"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_distillery"]
# The built web app is gitignored (vite writes it here); hatch drops ignored files unless they are artifacts.
artifacts = ["src/kb_distillery/_webapp/**"]

# The kits (src/kb_distillery/kits: kit.toml, defaults/, skills, later hooks) are package data: `packages` above
# carries every tracked file under the package, so they need no entry here.
# TRANSITIONAL (Lane C step 4 move these into kits/ and delete this table): the root-level folders the
# installed package still needs, packed under kb_distillery/_data/<same path> (config/resources.py root_resource()).
[tool.hatch.build.targets.wheel.force-include]
"share" = "kb_distillery/_data/share"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-p no:cacheprovider"
markers = [
    "serial: asserts a wall-clock budget, so it runs alone in a single process (the tests gate's second pass); never in the -n pass",
    "wheel: builds the wheel and installs it into a temp venv (slow, needs network for the build backend); CI job `wheel`",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]      # syntax errors, undefined names: the cheap class of real bugs

# [tool.importlinter] arrives with the layer contract (Lane E).
