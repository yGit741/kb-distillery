[template]
name = "starter"
version = 1
description = "A small general knowledge base: documents, notes and articles digested into ideas, questions, topics and people."

# The smallest ontology that stands on its own. Every layer is given here on purpose: a layer with no table falls
# back to the explorer's thesis-style defaults (kb.core.kbtypes), which a starter must not inherit.
# `color` is left out where a kb extending this template is likely to add types of its own: the loader then picks
# a palette colour no other type uses, so two types never share one.
[types]

# --- Sources: the digest of one raw item --------------------------------------------------------------------
[types.source.article]
label = "Article"
prefix = "article-"

[types.source.notes]
label = "Notes"
prefix = "notes-"
color = "#ffc777"

[types.source.document]
label = "Document"
prefix = "doc-"
color = "#eab0ee"

# --- Collections: how sources group ---------------------------------------------------------------------------
[types.collection.series]
label = "Series"
prefix = "series-"
kind = "contents"             # member files listed in a Contents table

# --- Concepts: what the kb grows -------------------------------------------------------------------------------
[types.concept.topic]
label = "Topic"
prefix = "theme-"

[types.concept.idea]
label = "Idea"
prefix = ""

[types.concept.question]
label = "Question"
prefix = "q-"
status = ["open", "partial", "resolved"]

[types.concept.person]
label = "Person"
prefix = ""
status = []                   # no status: progress is `verified:` (backend/src/kb/core/persons.py)
color = "#bb9af7"

# --- Edges: the typed relations a page may state in its `relations:` block -------------------------------------
[edges]
types = ["extends", "uses"]
