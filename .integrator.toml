# Integrator config (global skill ~/.claude/skills/integrator). "Done" = every check below PASSes against
# reality: screenshots of every screen, and each status tile's text equal to the endpoint behind it.
test = "pixi run test"
build_check = "pixi run web-check"
app_start = "pixi run app"
app_timeout = 90
base_url = "http://127.0.0.1:8765/app"
# deployed site to re-run the screens against after the owner deploys (private site needs sign-in; empty = skip)
deployed_base_url = ""

round_open = "pixi run ship -- round open"
round_status = "pixi run ship -- round status"  # + round number
events = "pixi run ship -- events"  # + PR number
claims = "pixi run ship -- claims"
# Agents never deploy: they nudge the deploy owner (kb_distillery.share.owner, PR #140) and wait for its status.
deploy_request = "pixi run python -m kb_distillery.share.owner nudge"
deploy_status = "pixi run python -m kb_distillery.share.owner status"
deployed_match = "deployed"

settle_ms = 1500
error_texts = ["Could not load", "Something went wrong", "Not Found"]

# From web/src/routes/defs.ts (Share is private-profile only, absent from the local app).
screens = [
  { id = "home", path = "/" },
  { id = "graph", path = "/graph" },
  { id = "system", path = "/system", selector = "[data-testid=tile-nightly]" },
  { id = "system-flags", path = "/system?tab=flags", selector = "[data-testid=flags-table]" },
  { id = "pages", path = "/pages" },
  { id = "chat", path = "/chat" },
  { id = "scopes", path = "/scopes" },
  { id = "pipeline", path = "/pipeline" },
  { id = "lifecycle", path = "/lifecycle" },
  { id = "start", path = "/start" },
  { id = "covector", path = "/covector" },
]

# tile text (data-testid=tile-<id>-value on /system) vs the endpoint it claims to show.
# fail_tones: also FAIL when the tile's data-tone is one of these (the status is true but bad).
# path: dotted keys, |max:<field> (latest), |filter:<field>=a,b, |count, |default:<x>, |map:a=b,…, "{p} / {q}".
[[data_checks]]
tile = "nightly"
screen = "/system"
endpoint = "/api/ops"
path = "runs|max:started|.status|default:no runs yet"
fail_tones = ["bad"]  # a correctly shown failed nightly is still not "done"
selector = "[data-testid=tile-nightly-value]"

[[data_checks]]
tile = "lint"
screen = "/system"
endpoint = "/api/health"
path = "{values.errors|default:0} / {values.warnings|default:0}"
fail_tones = ["bad"]
selector = "[data-testid=tile-lint-value]"

[[data_checks]]
tile = "hygiene"
screen = "/system"
endpoint = "/api/ops"
path = "{hygiene.errors|default:0} / {hygiene.warnings|default:0}"
selector = "[data-testid=tile-hygiene-value]"

[[data_checks]]
tile = "merges"
screen = "/system"
endpoint = "/api/ops"
path = "queue.holder.pr|default:idle"
match = "contains"
fail_tones = ["bad"]  # stuck / dead holder
selector = "[data-testid=tile-merges-value]"

[[data_checks]]
tile = "stale"
screen = "/system"
endpoint = "/api/ops"
# kinds mirror STALE_KINDS in web/src/features/system/model.ts
path = "hygiene.findings|filter:kind=idle-branch,missing-worktree,detached-worktree,idle-pr|count|map:0=none"
selector = "[data-testid=tile-stale-value]"

[[data_checks]]
tile = "version"
screen = "/system"
endpoint = "/api/lifecycle"
path = "version"
match = "contains"
selector = "[data-testid=tile-version-value]"

[[data_checks]]
tile = "deploy"
screen = "/system"
endpoint = "/api/ops"
# deploy owner state (kb_distillery.share.owner) vs origin/main; bad = failed outcome, owner missing/dead, or live != main > 30 min
path = "deploy.owner_installed|default:unknown|map:false=owner not installed,true="  # the tone carries the rest
match = "contains"
fail_tones = ["bad"]
selector = "[data-testid=tile-deploy-value]"

[[data_checks]]
tile = "flags"
screen = "/system?tab=flags"
endpoint = "/api/flags"
# Flags tab row count == registry count (meta/flags.toml, served by GET /api/flags)
path = "flags|count"
selector = "[data-testid=flags-count]"
