[workspace]
name = "thesis-wiki"
version = "0.1.0"
description = "Thesis knowledge base tooling"
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[dependencies]
python = ">=3.11"
pymupdf = "*"
pillow = "*"
ipykernel = "*"
wandb = ">=0.28.1,<0.29"
nodejs = ">=22,<23"
truststore = ">=0.9"
pytest = ">=8"
fastapi = ">=0.162.0,<0.163"
uvicorn = ">=0.54.0,<0.55"
pydantic = ">=2"
httpx = ">=0.28.1,<0.29"

[activation.env]
# a worktree shares the primary's env (symlinked .pixi), whose editable install points at one fixed tree:
# put this checkout's source first so `import kb` always resolves to the tree you run in
PYTHONPATH = "$PIXI_PROJECT_ROOT/backend/src"

[tasks]
harness = { cmd = "python -m tests.harness.run_pipeline", env = { PYTHONPATH = "backend" } }
harness-invariants = { cmd = "python -m tests.harness.vault_invariants", env = { PYTHONPATH = "backend" } }
harness-bite = { cmd = "python -m tests.harness.harness_bite", env = { PYTHONPATH = "backend" } }
lint = "python -m kb.lint.lint"
health = "python -m kb.lint.lint --health"
lint-strict = "python -m kb.lint.lint --ingest-strict"
dashboard = "python -m kb.dashboard"
app = "python -m kb.api --port 8765"
api-schema = "python -m kb.api.export_schema"
api-schema-check = "python -m kb.api.export_schema --check"
launch = "bash tools/launch.sh"
ingest-status = "python -m kb.ingest status"
scrap-mail = "python -m kb.ingest scrap-mail"
scrap-gdrive = "python -m kb.ingest scrap-gdrive"
distill-propose = "python -m kb.distill propose"
distill-apply = "python -m kb.distill apply"
query-candidates = "python -m kb.search.query candidates"
summarize = "python -m kb.summaries"
coherence-status = "python -m kb.core.coherence status"
semfind-bundle = "python -m kb.search.semfind bundle"
semfind-moc = "python -m kb.search.semfind moc"
sync-skills = "python -m kb.maintenance.sync_skills"
lint-skills = "python -m kb.lint.lint_skills"
test-skills = "pytest backend/tests/lint/test_skills.py"
fix-math = "python -m kb.maintenance.fix_math"
index-researcher = "python -m kb.ingest index-researcher"
export-kb = "python -m kb.maintenance.export"
share = "python -m kb.share"
show = "python -m kb.share.show"
daily-sync = "python -m kb.maintenance.daily_sync"
hygiene = "python -m kb.ops.hygiene"
nightly-report = "python -m kb.ops.nightly_report"
notify-test = "python -m kb.maintenance.notify --test"
ship = "python -m kb.git.ship"
lanes = "python -m kb.git.ship --status"
curate-history = "python -m kb.git.curate_history"
ops = "python -m kb.ops"
metrics = "python -m kb.metrics"
install-hooks = "git config core.hooksPath tools/githooks"
test = "pytest backend/tests"
web-install = "npm ci --prefix frontend"
web-dev = "npm run dev --prefix frontend"
web-build = "npm run build --prefix frontend"
flags-gen = "python -m kb.flags.codegen"
flags-check = "python -m kb.flags.codegen --check && python -m kb.flags.coverage"
web-check = { cmd = "python -m kb.flags.codegen --check && python -m kb.flags.coverage && npm run typecheck --prefix frontend && npm run test --prefix frontend && npm run build:check --prefix frontend && bash tools/check-untracked-dist.sh" }
test-worker = "node --test share/*.test.mjs"
test-e2e = "node --test backend/src/kb/dashboard/e2e/*.test.mjs frontend/e2e/*.test.mjs"
test-ui-principles = "node --test frontend/tests/ui-principles.test.mjs"
install-sync = "bash tools/launchd/install.sh"
install-deploy-owner = "bash tools/launchd/install-deploy-owner.sh"

[pypi-dependencies]
kb = { path = "backend", editable = true }
claude-agent-sdk = ">=0.1.0"
yt-dlp = { version = ">=2025.1", extras = ["default", "curl-cffi"] }
opencv-python-headless = ">=4.10"
imageio-ffmpeg = ">=0.5"
ocrmac = ">=1.0"
