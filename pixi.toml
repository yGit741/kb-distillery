[workspace]
name = "kb-distillery"
version = "0.1.0"
description = "kb-distillery: the engine behind every knowledge base in kbs/"
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[dependencies]
python = ">=3.11"
pymupdf = "*"
pillow = "*"
ipykernel = "*"
wandb = ">=0.28.1,<0.29"
nodejs = ">=22,<23"
truststore = ">=0.9"
pytest = ">=8"
pytest-xdist = ">=3"
fastapi = ">=0.162.0,<0.163"
uvicorn = ">=0.54.0,<0.55"
pydantic = ">=2"
httpx = ">=0.28.1,<0.29"

[activation.env]
# a worktree shares the primary's env (symlinked .pixi), whose editable install points at the primary checkout:
# put this checkout's source first so `import kb_distillery` always resolves to the tree you run in. KEPT after the
# root pyproject.toml landed (Lane A): without it a worktree's gates would test the primary's code, not the branch.
PYTHONPATH = "$PIXI_PROJECT_ROOT/src"
# no deploy from any session or the nightly sync until the owner turns it on (ship merge and ops call share_autodeploy)
KB_SHARE_AUTODEPLOY = "0"

[tasks]
harness = { cmd = "python -m tests.harness.run_pipeline", env = { PYTHONPATH = "src:." } }
harness-invariants = { cmd = "python -m tests.harness.vault_invariants", env = { PYTHONPATH = "src:." } }
harness-bite = { cmd = "python -m tests.harness.harness_bite", env = { PYTHONPATH = "src:." } }
lint = "python -m kb_distillery.lint.lint"
okf-check = "python -m kb_distillery.lint.okf_check"
backlog = "python -m kb_distillery.services.backlog"
kb-list = "python -m kb_distillery.kbconfig list"
kb-show = "python -m kb_distillery.kbconfig show"
digest-instructions = "python -m kb_distillery.core.digest"
health = "python -m kb_distillery.lint.lint --health"
lint-strict = "python -m kb_distillery.lint.lint --ingest-strict"
dashboard = "python -m kb_distillery.dashboard"
app = "python -m kb_distillery.api --port 8765"
api-schema = "python -m kb_distillery.api.export_schema"
api-schema-check = "python -m kb_distillery.api.export_schema --check"
launch = "bash scripts/launch.sh"
ingest-status = "python -m kb_distillery.ingest status"
scrap-mail = "python -m kb_distillery.ingest scrap-mail"
scrap-gdrive = "python -m kb_distillery.ingest scrap-gdrive"
distill-propose = "python -m kb_distillery.distill propose"
distill-apply = "python -m kb_distillery.distill apply"
query-candidates = "python -m kb_distillery.search.query candidates"
summarize = "python -m kb_distillery.summaries"
llm = "python -m kb_distillery.llm"
qmd-install = "npm ci --no-fund --no-audit --prefix scripts/qmd"
qmd-serve = "bash scripts/qmd/with-kb.sh scripts/qmd/server.mjs"
qmd-cards = "python -m kb_distillery.search.cards"
vectors-build = "bash scripts/qmd/with-kb.sh scripts/qmd/vectors.mjs"
vectors = "python -m kb_distillery.search.vectors"
coherence-status = "python -m kb_distillery.core.coherence status"
semfind-bundle = "python -m kb_distillery.search.semfind bundle"
semfind-moc = "python -m kb_distillery.search.semfind moc"
sync-skills = "python -m kb_distillery.maintenance.sync_skills"
lint-skills = "python -m kb_distillery.lint.lint_skills"
test-skills = "pytest tests/lint/test_skills.py"
index-researcher = "python -m kb_distillery.ingest index-researcher"
export-kb = "python -m kb_distillery.publish.export"
share = "python -m kb_distillery.share"
show = "python -m kb_distillery.share.show"
daily-sync = "python -m kb_distillery.ops.daily_sync"
hygiene = "python -m kb_distillery.ops.hygiene"
nightly-report = "python -m kb_distillery.ops.nightly_report"
notify-test = "python -m kb_distillery.ops.notify --test"
ship = "python -m kb_distillery.git.ship"
lanes = "python -m kb_distillery.git.ship --status"
curate-history = "python -m kb_distillery.git.curate_history"
ops = "python -m kb_distillery.ops"
metrics = "python -m kb_distillery.metrics"
install-hooks = "git config core.hooksPath scripts/githooks"
install-kb-hooks = "bash scripts/install-kb-hooks.sh"
test = "pytest tests"
test-wheel = { cmd = "pytest tests/cli/test_install_wheel.py -q", env = { KB_TEST_WHEEL = "1", PYTHONPATH = "" } }
web-install = "npm ci --prefix web"
web-dev = "npm run dev --prefix web"
web-build = "npm run build --prefix web"
flags-gen = "python -m kb_distillery.flags.codegen"
flags-check = "python -m kb_distillery.flags.codegen --check && python -m kb_distillery.flags.coverage"
web-check = { cmd = "python -m kb_distillery.flags.codegen --check && python -m kb_distillery.flags.coverage && npm run typecheck --prefix web && npm run test --prefix web && npm run build:check --prefix web && bash scripts/check-untracked-dist.sh" }
test-worker = "node --test share/*.test.mjs"
test-e2e = "node --test src/kb_distillery/dashboard/e2e/*.test.mjs web/e2e/*.test.mjs"
test-ui-principles = "node --test web/tests/ui-principles.test.mjs"
install-sync = "bash examples/launchd/install.sh"
install-deploy-owner = "bash examples/launchd/install-deploy-owner.sh"

[pypi-dependencies]
kb-distillery = { path = ".", editable = true }
claude-agent-sdk = ">=0.1.0"
yt-dlp = { version = ">=2025.1", extras = ["default", "curl-cffi"] }
opencv-python-headless = ">=4.10"
imageio-ffmpeg = ">=0.5"
ocrmac = ">=1.0"
grand-cypher = ">=1.2"
networkx = ">=3.4"
