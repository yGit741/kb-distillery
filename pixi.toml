[workspace]
name = "kb-distillery"
version = "0.1.0"
description = "kb-distillery: the engine behind every knowledge base in ~/knowledge"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[dependencies]
python = ">=3.11"
pypdfium2 = ">=4"
pillow = "*"
nodejs = ">=22,<23"
truststore = ">=0.9"
pytest = ">=8"
pytest-xdist = ">=3"
pip-licenses = ">=5"       # the licence gate (pixi run licenses)
python-build = ">=1"       # `pixi run build-wheel` (the PyPA `build` front end; hatchling is fetched into its isolated env)
fastapi = ">=0.162.0,<0.163"
uvicorn = ">=0.54.0,<0.55"
python-multipart = ">=0.0.9"        # the bundle upload of POST /api/kb/import
pydantic = ">=2"
httpx = ">=0.28.1,<0.29"
# runtime dependencies of pyproject.toml that the editable install used to supply: declared here so nothing leaves the env
pyyaml = ">=6"

[activation.env]
# THE way `import kb_distillery` resolves in this env. The package is deliberately NOT a [pypi-dependencies] entry
# (no `kb-distillery = { path = ".", editable = true }`): every worktree symlinks the primary's .pixi, and a `pixi run`
# in a worktree that did not skip the install re-pointed that shared editable install (the .pth file and the
# distill/kbd scripts) at the worktree, which broke the env when the worktree was removed. With no path into any
# checkout, the shared env is the same for all of them and this line picks the checkout you run in.
# tests/test_pixi_env.py fails if the path dependency comes back.
PYTHONPATH = "$PIXI_PROJECT_ROOT/src"
# no deploy from any session or the nightly sync until the owner turns it on (ship merge and ops call share_autodeploy)
KB_SHARE_AUTODEPLOY = "0"

[tasks]
# the command line: `pixi run distill …` (kbd is the deprecated old name); outside the repo see dev.md § distill on PATH
distill = "python -m kb_distillery.cli"
kbd = "python -m kb_distillery.cli.legacy"
harness = { cmd = "python -m tests.harness.run_pipeline", env = { PYTHONPATH = "src:." } }
harness-invariants = { cmd = "python -m tests.harness.vault_invariants", env = { PYTHONPATH = "src:." } }
harness-bite = { cmd = "python -m tests.harness.harness_bite", env = { PYTHONPATH = "src:." } }
lint = "python -m kb_distillery.lint.lint"
okf-check = "python -m kb_distillery.lint.okf_check"
backlog = "python -m kb_distillery.services.backlog"
kb-list = "python -m kb_distillery.config.kb list"
kb-show = "python -m kb_distillery.config.kb show"
digest-instructions = "python -m kb_distillery.vault.digest"
health = "python -m kb_distillery.lint.lint --health"
lint-strict = "python -m kb_distillery.lint.lint --ingest-strict"
app = "python -m kb_distillery.server --port 8765"
api-schema = "python -m kb_distillery.server.export_schema"
api-schema-check = "python -m kb_distillery.server.export_schema --check"
launch = "bash scripts/launch.sh"
ingest-status = "python -m kb_distillery.ingest status"
scrap-mail = "python -m kb_distillery.ingest scrap-mail"
scrap-gdrive = "python -m kb_distillery.ingest scrap-gdrive"
distill-propose = "python -m kb_distillery.distill propose"
distill-apply = "python -m kb_distillery.distill apply"
query-candidates = "python -m kb_distillery.search.query candidates"
summarize = "python -m kb_distillery.digest"
llm = "python -m kb_distillery.llm"
proposals-nightly = "python -m kb_distillery.proposals nightly"
qmd-install = "npm ci --no-fund --no-audit --prefix scripts/qmd"
qmd-serve = "bash scripts/qmd/with-kb.sh scripts/qmd/server.mjs"
qmd-cards = "python -m kb_distillery.search.cards"
vectors-build = "bash scripts/qmd/with-kb.sh scripts/qmd/vectors.mjs"
vectors = "python -m kb_distillery.search.vectors"
coherence-status = "python -m kb_distillery.vault.coherence status"
semfind-bundle = "python -m kb_distillery.search.semfind bundle"
semfind-moc = "python -m kb_distillery.search.semfind moc"
lint-skills = "python -m kb_distillery.lint.lint_skills"
# fails on a GPL / LGPL / AGPL package in the env (allowlist with reasons in lint/licenses.py); a ship gate and a CI step
licenses = "python -m kb_distillery.lint.licenses"
# layer contract in pyproject.toml [tool.importlinter]; needs `import-linter` (dev extra) in the env
lint-imports = "python -c \"from importlinter.cli import lint_imports_command as m; m()\" --no-cache"
test-skills = "pytest tests/lint/test_skills.py"
index-researcher = "python -m kb_distillery.ingest index-researcher"
export-kb = "python -m kb_distillery.publish.export"
share = "python -m kb_distillery.publish.cloudflare"
parse = "python -m kb_distillery.parse.cli"
show = "python -m kb_distillery.publish.site.show"
daily-sync = "python -m kb_distillery.ops.daily_sync"
hygiene = "python -m kb_distillery.ops.hygiene"
nightly-report = "python -m kb_distillery.ops.nightly_report"
notify-test = "python -m kb_distillery.ops.notify --test"
ship = "python -m kb_distillery.git.ship"
lanes = "python -m kb_distillery.git.ship --status"
curate-history = "python -m kb_distillery.git.curate_history"
ops = "python -m kb_distillery.ops"
metrics = "python -m kb_distillery.metrics"
install-hooks = "git config core.hooksPath scripts/githooks"
install-kb-hooks = "python -m kb_distillery.cli hooks install"
test = "pytest tests"
test-wheel = { cmd = "pytest tests/cli/test_install_wheel.py -q", env = { KB_TEST_WHEEL = "1", PYTHONPATH = "" } }
build-wheel = { cmd = "python -m build --wheel --outdir dist", depends-on = ["web-build"] }   # the wheel ships the built app (_webapp)
web-install = "npm ci --prefix web"
web-dev = "npm run dev --prefix web"
web-build = { cmd = "npm run build --prefix web", depends-on = ["web-install"] }   # a fresh tree has no web/node_modules
flags-gen = "python -m kb_distillery.config.flags.codegen"
flags-check = "python -m kb_distillery.config.flags.codegen --check && python -m kb_distillery.config.flags.coverage"
web-check = { cmd = "python -m kb_distillery.config.flags.codegen --check && python -m kb_distillery.config.flags.coverage && npm run typecheck --prefix web && npm run test --prefix web && npm run build:check --prefix web && bash scripts/check-untracked-dist.sh" }
worker-bundle = "node src/kb_distillery/publish/cloudflare/worker/build-okf.mjs"   # the web checker as okf.gen.js for the Worker inbox (needs `pixi run web-install` once)
test-worker = { cmd = "node --test src/kb_distillery/publish/cloudflare/worker/*.test.mjs", depends-on = ["worker-bundle"] }
test-e2e = "node --test tests/e2e/*.test.mjs"
test-ui-principles = "node --test web/tests/ui-principles.test.mjs"
install-sync = "bash examples/launchd/install.sh"
install-deploy-owner = "bash examples/launchd/install-deploy-owner.sh"

[pypi-dependencies]
numpy = ">=2"
pyjwt = { version = ">=2", extras = ["crypto"] }
claude-agent-sdk = ">=0.1.0"
yt-dlp = { version = ">=2025.1", extras = ["default", "curl-cffi"] }
opencv-python-headless = ">=4.10"
imageio-ffmpeg = ">=0.5"
grand-cypher = ">=1.2"
reportlab = ">=4"            # builds the PDF fixtures in tests (from PyPI: the conda build drags in LGPL pycairo)
networkx = ">=3.4"
import-linter = ">=2"

# macOS-only: Apple Vision OCR (pyobjc). Linux has no OCR backend yet (docs/public-roadmap.md, Ideas).
[target.osx-arm64.pypi-dependencies]
ocrmac = ">=1.0"

[target.osx-64.pypi-dependencies]
ocrmac = ">=1.0"
