[workspace]
name = "thesis-wiki"
version = "0.1.0"
description = "Thesis knowledge base tooling"
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[dependencies]
python = ">=3.11"
pymupdf = "*"
pillow = "*"
ipykernel = "*"
wandb = ">=0.28.1,<0.29"

[tasks]
lint = "python meta/lint.py"
health = "python meta/lint.py --health"
lint-strict = "python meta/lint.py --ingest-strict"
dashboard = "python -m meta.dashboard"
launch = "bash meta/launch.sh"
ingest-status = "python -m meta.ingest status"
scrap-mail = "python -m meta.ingest scrap-mail"
scrap-gdrive = "python -m meta.ingest scrap-gdrive"
distill-propose = "python -m meta.distill propose"
distill-apply = "python -m meta.distill apply"
query-candidates = "python meta/query.py candidates"
coherence-status = "python meta/coherence.py status"
semfind-bundle = "python meta/semfind.py bundle"
semfind-moc = "python meta/semfind.py moc"
sync-skills = "python meta/sync_skills.py"
lint-skills = "python meta/lint_skills.py"
test-skills = "python -m unittest meta.test_skills"
fix-math = "python meta/fix_math.py"
index-researcher = "python -m meta.ingest index-researcher"
export-kb = "python meta/export.py"
daily-sync = "python meta/daily_sync.py"
ship = "python meta/ship.py"
lanes = "python meta/ship.py --status"
install-sync = "bash meta/launchd/install.sh"
