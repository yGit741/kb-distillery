name: Feature request
description: A change or addition you want.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what stops you.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would change or add.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you considered, including doing nothing.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI
        - Ingest
        - Digest
        - Graph or search
        - Web app
        - Publishing
        - Kits or skills
        - Storage connector
        - Docs
        - Other
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I can open a pull request for this.
