# Secret scan on every push and pull request: gitleaks over the full history of the checkout.
#
# Read-only: it checks out the code and reports findings. It never deploys or publishes, and it uses no
# secret other than the automatic, read-scoped GITHUB_TOKEN the action asks for (permissions below).
# GitHub-hosted runner on purpose: the scan needs no pixi and no Mac, and a hosted runner is the safe choice
# for code from forks. Pinned to a full release tag (gitleaks-action v3.0.0, Node 24).
# The action is free for repositories owned by a user account; a repository owned by an organization needs a
# GITLEAKS_LICENSE secret (free key from gitleaks.io), added in the repo settings, never in this file.
name: secret-scan
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # scan every commit, not just the tip
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}     # only needed for organization-owned repos
