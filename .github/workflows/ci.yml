# PR checks (informational — no branch protection). Runs the same gates as `pixi run ship`.
#
# KB_CI=1 is required: 445 of the ~590 files under raw/ are gitignored binaries (PDFs, PNGs,
# PPTX), so a cloud checkout has meta/corpus.tsv but not the bytes it lists. Without the flag,
# src/kb_distillery/lint/lint.py would treat them as gone — dropping manifest rows, regenerating index.md /
# corpus.tsv and erroring on every `raw:` reference. KB_CI keeps the wiki checks (frontmatter,
# links, slugs, book partitions, course tables, collections, coherence) and reads the committed
# manifest as the truth instead of reconciling it against disk.
#
# Runs on every push and every pull request. The runner follows the repo's visibility: while the repo is
# private the jobs run on the owner's self-hosted Mac (free); once it is public they run on GitHub-hosted
# `macos-latest` (arm64), so this file's jobs never run a fork's code on the owner's machine. That is not the whole
# defence: a fork PR can bring its own workflow file naming `self-hosted`, so before going public remove the runner
# from the repo (or set Settings > Actions > "Require approval for all outside collaborators").
# `runs-on` takes `fromJSON(...)` (a label list) and `&&`/`||` picks it; `private` is the repository context,
# not a secret. tests/ci/test_workflows.py fails on any pull_request job that could land on `self-hosted` when public.
#
# Self-hosted runner on the owner's Mac while private (osx-arm64, the only platform pixi.lock is solved for).
# GitHub-hosted macOS minutes bill 10x and exhausted the Free plan's 2,000 min/month on a private
# repo (every job refused from 2026-10-22); a self-hosted runner is free and unlimited. Jobs run
# only while the Mac is awake and the runner service is up — otherwise they queue. Only the owner
# pushes to this private repo, so running PR code on the Mac is no wider trust than `ship` itself.
# Setup: repo Settings → Actions → Runners → New self-hosted runner (macOS, ARM64), then
# `./svc.sh install && ./svc.sh start`. Behind the TLS-inspecting proxy, put SSL_CERT_FILE in the
# runner's `.env` file so pixi can download packages.
#
# setup-pixi cache: false — checkout's `git clean -ffdx` removes .pixi/ each run, but the
# runner keeps pixi's package cache (~/Library/Caches/rattler), so a reinstall is local and fast;
# the GitHub cache would only add an upload/download round-trip.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true     # a newer push to the same branch or PR replaces the running check
jobs:
  python:     # pytest (includes the privacy ratchet), skills lint, layer contract, kb lint
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","macOS","ARM64"]') || 'macos-latest' }}
    env:
      KB_CI: "1"     # tests that build dashboard snapshots run lint too (test_digestion_data)
      KB_PRIVACY_TERMS: ${{ secrets.KB_PRIVACY_TERMS }}     # personal terms the privacy ratchet looks for (comma list); empty = token shapes only
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git show-ref -q refs/heads/main || git branch main origin/main   # a PR checkout has no local main
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.76.1
          cache: false
      - run: pixi run test
      - name: Privacy ratchet (no personal strings or token shapes in new files; also part of the suite above)
        run: pixi run pytest tests/lint/test_privacy_ratchet.py
      - run: pixi run lint-skills
      - run: pixi run licenses     # fails on a GPL / LGPL / AGPL package (PyMuPDF was one); allowlist in lint/licenses.py
      - run: pixi run lint-imports
      - run: pixi run lint
      # ruff is not a pixi dependency yet, so there is no ruff step; it joins here once pixi.toml carries it.

  web:     # flags codegen check, tsc, vitest, build:check, check-untracked-dist (all inside the web-check task)
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","macOS","ARM64"]') || 'macos-latest' }}
    env:
      KB_CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git show-ref -q refs/heads/main || git branch main origin/main   # a PR checkout has no local main
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.76.1
          cache: false
      - run: pixi run web-install
      - run: pixi run web-check

  wheel:     # builds the wheel, installs it into a clean venv, runs the installed CLI (tests/cli/test_install_wheel.py)
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","macOS","ARM64"]') || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git show-ref -q refs/heads/main || git branch main origin/main   # a PR checkout has no local main
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.76.1
          cache: false
      - run: pixi run test-wheel

  worker:     # Cloudflare worker node tests
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","macOS","ARM64"]') || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git show-ref -q refs/heads/main || git branch main origin/main   # a PR checkout has no local main
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.76.1
          cache: false
      - run: pixi run test-worker
