# The gates. CI is the truth for a PR: `pixi run ship` opens the PR and enqueues the merge, GitHub runs these
# jobs on the PR and again on the merge-queue group, and the one required check `all-green` decides the merge.
#
# Triggers: every pull request, every merge-queue group (`merge_group`), pushes to main (the post-merge run) and
# a manual dispatch. Branch pushes alone do not run (a branch without a PR has nothing to gate), so a push to a
# PR branch runs CI once, not twice.
#
# Runners: GitHub-hosted `ubuntu-latest` only. A fork's pull request never reaches a self-hosted machine
# (tests/ci/test_workflows.py fails on any other runner).
#
# Jobs: `lint` (the cheap gates, ~1-2 min), `tests` (pytest in 5 static shards, each with `-n auto` and a
# per-test timeout; the shard list and the `--ignore`s of the last shard must cover every tests/ dir exactly
# once, tests/ci/test_workflows.py checks that), `web` (web-check), `wheel`, `worker`, `docker` (builds the Dockerfile without pushing, smoke-tests the image), and `all-green`, the
# fan-in that is green only when every other job succeeded (cancelled or skipped count as red). Branch
# protection names `all-green` alone, so the shards need no naming there.
#
# Concurrency: a newer push to the same PR replaces its running check; a merge-group run is never cancelled
# (GitHub treats a cancelled group as failed and drops it from the queue).
#
# KB_CI=1: a cloud checkout may lack gitignored raw binaries that meta/corpus.tsv lists; the flag makes lint
# read the committed manifest as the truth instead of reconciling it against disk.
name: ci
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:     # skills lint, licences, layer contract, kb lint, okf check, ruff, privacy ratchet
    runs-on: ubuntu-latest
    env:
      KB_CI: "1"
      KB_PRIVACY_TERMS: ${{ secrets.KB_PRIVACY_TERMS }}     # personal terms the privacy ratchet looks for (comma list); empty = token shapes only
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git show-ref -q refs/heads/main || git branch main origin/main   # a PR checkout has no local main
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.76.1
          cache: true
      - run: pixi run lint-skills
      - run: pixi run licenses     # fails on a GPL / LGPL / AGPL package (PyMuPDF was one); allowlist in lint/licenses.py
      - run: pixi run lint-imports
      - run: pixi run lint -- --kb examples/demo         # the demo kb, as the ship gate lints it (no kb is selected on a runner)
      - run: pixi run okf-check -- --kb examples/demo
      - run: pixi run ruff
      - name: Privacy ratchet (no personal strings or token shapes in new files)
        run: pixi run pytest -q tests/lint/test_privacy_ratchet.py
      - name: Public export (owner-only paths export-ignored and absent from git archive, privacy scan of the archive)
        run: pixi run check-export

  tests:     # pytest (the `serial` wall-clock test runs alone, in the shard that owns tests/ingest)
    runs-on: ubuntu-latest
    env:
      KB_CI: "1"
    strategy:
      fail-fast: false
      matrix:
        include:     # sized so the slowest shard (git: real repos and subprocesses) stays near a minute
          - shard: git
            paths: tests/git
          - shard: ops-vault
            paths: tests/ops tests/metrics tests/vault
          - shard: server
            paths: tests/server tests/services tests/llm tests/proposals tests/graph
          - shard: ingest-publish
            paths: tests/ingest tests/publish tests/digest tests/distill
            serial: tests/ingest
          - shard: rest
            paths: >-
              tests --ignore=tests/git --ignore=tests/ops --ignore=tests/metrics --ignore=tests/vault
              --ignore=tests/server --ignore=tests/services --ignore=tests/llm --ignore=tests/proposals --ignore=tests/graph
              --ignore=tests/ingest --ignore=tests/publish --ignore=tests/digest --ignore=tests/distill
    name: tests (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git show-ref -q refs/heads/main || git branch main origin/main   # a PR checkout has no local main
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.76.1
          cache: true
      - run: pixi run pytest -q -n auto -m "not serial" ${{ matrix.paths }}
      - if: matrix.serial
        run: pixi run pytest -q -m serial ${{ matrix.serial }}

  web:     # flags codegen check, tsc, vitest, build:check, check-untracked-dist (all inside the web-check task)
    runs-on: ubuntu-latest
    env:
      KB_CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git show-ref -q refs/heads/main || git branch main origin/main   # a PR checkout has no local main
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.76.1
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: Does this pull request touch the app? (a merge-group run and a main push always check it)
        id: app
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && git diff --quiet "origin/$BASE...HEAD" -- web/ pixi.toml pixi.lock \
               src/kb_distillery/config/flags src/kb_distillery/kits/base/defaults/flags.toml src/kb_distillery/webbuild.py scripts/check-untracked-dist.sh; then
            echo "skip=1" >> "$GITHUB_OUTPUT"; echo "no app change in this pull request: web-check waits for the merge queue"
          fi
      - if: steps.app.outputs.skip != '1'
        run: pixi run web-install
      - if: steps.app.outputs.skip != '1'
        run: pixi run web-check

  checks:     # the lane checks `ship pr` used to run locally: API schema, flags registry, the graph e2e still-canvas test, ui-principles
    runs-on: ubuntu-latest
    env:
      KB_CI: "1"
      PLAYWRIGHT_MODULE: /home/runner/pw/node_modules/playwright     # the package dir: tests/e2e and web/tests join index.mjs to it
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git show-ref -q refs/heads/main || git branch main origin/main   # a PR checkout has no local main
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.76.1
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - run: pixi run web-install
      - run: pixi run api-schema-check
      - run: pixi run flags-check
      - run: pixi run web-build     # both browser suites serve the built app (src/kb_distillery/_webapp is gitignored)
      - name: Playwright (the npm package and Chromium; pixi does not ship it)
        run: mkdir -p ~/pw && cd ~/pw && npm init -y > /dev/null && npm i --no-fund --no-audit playwright@1 && npx playwright install --with-deps chromium
      - name: Graph e2e (a skipped suite is a failure here, never a silent green)
        run: set -o pipefail; pixi run test-e2e 2>&1 | tee e2e.log; ! grep -Eq '^# skip(ped)? [1-9]' e2e.log
      - name: ui-principles, every screen (same rule)
        run: set -o pipefail; pixi run test-ui-principles 2>&1 | tee ui.log; ! grep -Eq '^# skip(ped)? [1-9]' ui.log

  wheel:     # builds the wheel, installs it into a clean venv, runs the installed CLI (tests/cli/test_install_wheel.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git show-ref -q refs/heads/main || git branch main origin/main   # a PR checkout has no local main
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.76.1
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - run: pixi run test-wheel

  worker:     # Cloudflare worker node tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git show-ref -q refs/heads/main || git branch main origin/main   # a PR checkout has no local main
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.76.1
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - run: pixi run web-install   # esbuild + js-yaml for the Worker inbox's checker bundle (worker-bundle)
      - run: pixi run test-worker

  docker:     # builds ./Dockerfile for real (linux/amd64, nothing is pushed) and runs the CLI inside the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git show-ref -q refs/heads/main || git branch main origin/main   # a PR checkout has no local main
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.76.1
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - run: pixi run build-wheel     # the Dockerfile's build context needs dist/*.whl, as in release.yml (the wheel carries the built app)
      - id: version
        run: echo "version=$(pixi run python -c 'from kb_distillery.git.release import current_version; print(current_version())')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: kb-distillery:ci
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            KB_WEB_BUNDLE_REPO=${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (the CLI runs, the app bundle is inside, as the unprivileged user)
        run: |
          docker run --rm kb-distillery:ci distill --help
          docker run --rm kb-distillery:ci python -c "from kb_distillery.config.resources import resource; assert (resource('_webapp') / 'index.html').is_file()"
          docker run --rm -e KB_AUTH_EMAIL=ci@example.com -e KB_AUTH_JWKS_URL=https://proxy.example.com/keys -e KB_AUTH_AUDIENCE=ci kb-distillery:ci distill doctor     # the image refuses to run without an identity setup, as in production

  all-green:     # the one required check: every job above succeeded (cancelled or skipped is red too)
    needs: [lint, tests, web, checks, wheel, worker, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
