# PR checks (informational — no branch protection). Runs the same gates as `pixi run ship`.
#
# KB_CI=1 is required: 445 of the ~590 files under raw/ are gitignored binaries (PDFs, PNGs,
# PPTX), so a cloud checkout has meta/corpus.tsv but not the bytes it lists. Without the flag,
# backend/src/kb/lint/lint.py would treat them as gone — dropping manifest rows, regenerating index.md /
# corpus.tsv and erroring on every `raw:` reference. KB_CI keeps the wiki checks (frontmatter,
# links, slugs, book partitions, course tables, collections, coherence) and reads the committed
# manifest as the truth instead of reconciling it against disk.
#
# Self-hosted runner on the owner's Mac (osx-arm64, the only platform pixi.lock is solved for).
# GitHub-hosted macOS minutes bill 10x and exhausted the Free plan's 2,000 min/month on a private
# repo (every job refused from 2026-10-22); a self-hosted runner is free and unlimited. Jobs run
# only while the Mac is awake and the runner service is up — otherwise they queue. Only the owner
# pushes to this private repo, so running PR code on the Mac is no wider trust than `ship` itself.
# Setup: repo Settings → Actions → Runners → New self-hosted runner (macOS, ARM64), then
# `./svc.sh install && ./svc.sh start`. Behind the TLS-inspecting proxy, put SSL_CERT_FILE in the
# runner's `.env` file so pixi can download packages.
#
# setup-pixi cache: false — checkout's `git clean -ffdx` removes .pixi/ each run, but the
# runner keeps pixi's package cache (~/Library/Caches/rattler), so a reinstall is local and fast;
# the GitHub cache would only add an upload/download round-trip.
name: ci
on:
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    runs-on: [self-hosted, macOS, ARM64]
    env:
      KB_CI: "1"     # for every step: tests that build dashboard snapshots run lint too (test_digestion_data)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # lifecycle data reads kb(...) history and kb-x.y.z tags
      - run: git show-ref -q refs/heads/main || git branch main origin/main   # a PR checkout has no local main
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.76.1
          cache: false
      - run: pixi run test
      - run: pixi run lint-skills
      - run: pixi run lint
