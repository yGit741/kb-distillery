# Daily fallback deploy of the private site (Worker `kb`) from GitHub.
#
# The deploy owner (backend/src/kb/share/owner.py, launchd com.thesis-kb.deploy-owner) is the one
# process that deploys main: kb(...) ops, merges and the nightly sync only nudge it. This workflow is
# the fallback for when the owner has been idle: `owner fresh --hours 24` (the owner's state, else the
# newest kb-share deployment on Cloudflare) — a successful deploy in the last 24 h → the job is a no-op.
# Otherwise it runs `share deploy-main` with the same build, auth gate and guards:
#   - `skipped-same`  — the live Worker already serves this sha (the usual outcome; exit 0)
#   - `skipped-older` — the live Worker is newer than this checkout, never downgrade (exit 0)
#   - `deployed`      — the Mac had not deployed this sha yet
#   - `refused-no-access` / `failed` — the job is red; look at `share status` + the artifact
# It never touches snapshots (`snapshot-*` Workers) or the control panel — only `kb`.
#
# Credentials: wrangler reads CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID from the environment
# (repo secrets of the same name); the Mac uses the browser login instead. KB_SHARE_AUTODEPLOY=0
# keeps ops/ship from spawning a second detached deploy inside the runner.
#
# fetch-depth: 0 — the "never older" guard asks git whether the live sha is an ancestor of HEAD,
# and the builder reads KB-Version trailers / kb-x.y.z tags from history. KB_CI=1 — raw/ binaries
# are gitignored, so tests that lint must trust the committed manifest (see ci.yml).
# Self-hosted Mac runner, no GitHub cache — see ci.yml.
name: deploy-main
on:
  schedule:
    - cron: "0 6 * * *"     # 06:00 UTC daily, the morning after the 22:00 nightly sync
  workflow_dispatch:
concurrency:
  group: deploy-main
  cancel-in-progress: false     # a running deploy finishes; the next run queues behind it
jobs:
  deploy:
    runs-on: [self-hosted, macOS, ARM64]
    env:
      KB_CI: "1"
      KB_SHARE_AUTODEPLOY: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # ancestor guard + KB-Version history + kb-x.y.z tags
      - run: git show-ref -q refs/heads/main || git branch main origin/main   # a dispatch from a branch has no local main
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.76.1
          cache: false
      - name: Did the deploy owner deploy in the last 24 h?
        id: owner
        run: |
          if pixi run python -m kb.share.owner fresh --hours 24; then echo "stale=0" >> "$GITHUB_OUTPUT"; else echo "stale=1" >> "$GITHUB_OUTPUT"; fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - if: steps.owner.outputs.stale == '1'
        run: pixi run test
      - name: Build main and deploy it to the `kb` Worker (skips are success)
        if: steps.owner.outputs.stale == '1'
        run: pixi run share -- deploy-main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy status
        if: always()
        run: pixi run share -- status
      - name: Upload the built site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kb-site-main
          path: |
            .exported/share/main/index.html
            .exported/share/main/manifest.json
          retention-days: 30
          if-no-files-found: warn
